<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3D-просмотрщик — СИБКОНСТРАКТ</title><style>body{margin:0;background:#0b1420;color:#f0f4fa;font:16px system-ui}header{padding:17px 24px;background:#142335;display:flex;justify-content:space-between;gap:12px;align-items:center}strong span{color:#ffb64c}a{color:#ffb64c}main{max-width:1250px;margin:24px auto;padding:0 16px}h1{font-size:clamp(24px,4vw,38px)}#view{height:min(75vh,750px);min-height:420px;background:radial-gradient(#273d50,#0d1928);border:1px solid #3c5064;border-radius:14px;overflow:hidden;position:relative}canvas{width:100%;height:100%;display:block}#status{position:absolute;top:15px;left:15px;background:#142335dc;padding:9px 14px;border-radius:8px;max-width:85%}button{background:#ffb64c;color:#17212d;border:0;border-radius:8px;padding:10px 16px;font-weight:700;cursor:pointer}.tools{display:flex;gap:10px;flex-wrap:wrap;margin:15px 0}.muted{color:#b6c7d8}</style></head><body><header><strong>СИБ<span>КОНСТРАКТ</span></strong><a href="https://sibconstract.netlify.app/">Основной сайт</a></header><main><h1>3D-просмотр модели</h1><p class="muted">Вращайте модель мышью, приближайте колесом. Посетители могут только просматривать модель.</p><div id="view"><canvas id="canvas"></canvas><div id="status">Загрузка 3D-модели…</div></div><div class="tools"><button id="reset">Исходный вид</button><button id="full">На весь экран</button></div><p class="muted">Модель предоставлена СИБКОНСТРАКТ. Формат STL не содержит исходных цветов и текстур.</p></main><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script><script type="module">
import * as THREE from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';import {STLLoader} from 'three/addons/loaders/STLLoader.js';
const holder=document.getElementById('view'),canvas=document.getElementById('canvas'),status=document.getElementById('status');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene();scene.background=new THREE.Color('#172738');const camera=new THREE.PerspectiveCamera(40,1,.01,10000);const controls=new OrbitControls(camera,canvas);controls.enableDamping=true;controls.enablePan=true;
scene.add(new THREE.HemisphereLight(0xffffff,0x536a85,2.5));const sun=new THREE.DirectionalLight(0xffffff,2.7);sun.position.set(3,5,7);scene.add(sun);const fill=new THREE.DirectionalLight(0xffffff,1);fill.position.set(-4,2,-5);scene.add(fill);
let homePos=new THREE.Vector3(3,2,4),homeTarget=new THREE.Vector3();
new STLLoader().load('./model.stl',g=>{g.computeVertexNormals();g.computeBoundingBox();const bounds=g.boundingBox,center=bounds.getCenter(new THREE.Vector3()),size=bounds.getSize(new THREE.Vector3());g.translate(-center.x,-center.y,-center.z);const mesh=new THREE.Mesh(g,new THREE.MeshStandardMaterial({color:0xaab6c3,metalness:.48,roughness:.48,side:THREE.DoubleSide}));mesh.rotation.x=-Math.PI/2;scene.add(mesh);const max=Math.max(size.x,size.y,size.z),dist=max*2.1;camera.near=Math.max(.01,max/10000);camera.far=max*100;camera.updateProjectionMatrix();homePos.set(dist*.85,dist*.58,dist*.9);camera.position.copy(homePos);controls.target.set(0,0,0);controls.update();status.textContent='Модель загружена';setTimeout(()=>status.style.display='none',2200)},undefined,()=>{status.textContent='Файл модели пока не опубликован. Добавьте model.stl в корень репозитория.'});
function resize(){const r=holder.getBoundingClientRect();renderer.setSize(r.width,r.height,false);camera.aspect=r.width/r.height;camera.updateProjectionMatrix()}window.addEventListener('resize',resize);document.getElementById('reset').onclick=()=>{camera.position.copy(homePos);controls.target.copy(homeTarget);controls.update()};document.getElementById('full').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else holder.requestFullscreen()};document.addEventListener('fullscreenchange',resize);resize();function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera)}animate();
</script></body></html>
